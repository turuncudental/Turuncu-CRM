name: Supabase Keepalive

on:
  schedule:
    - cron: '0 9 */2 * *'  # Her 2 günde bir saat 09:00'da çalışır
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase'e ping at (3 deneme)
        run: |
          MAX=3
          DELAY=30
          STATUS=0

          for i in $(seq 1 $MAX); do
            echo "Deneme $i/$MAX..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
              "https://abtmfoetnhswccliuawn.supabase.co/rest/v1/crm_companies?select=id&limit=1" \
              -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFidG1mb2V0bmhzd2NjbGl1YXduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTMwMzIsImV4cCI6MjA5NTAyOTAzMn0.G_gyNgy1HZmaGSRvZ9aLDO-XneqU_K036APAEArhFMU" \
              -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFidG1mb2V0bmhzd2NjbGl1YXduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTMwMzIsImV4cCI6MjA5NTAyOTAzMn0.G_gyNgy1HZmaGSRvZ9aLDO-XneqU_K036APAEArhFMU" \
              2>/dev/null || echo "000")

            echo "HTTP yanıtı: $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "✅ Supabase aktif ve sağlıklı"
              exit 0
            fi

            if [ $i -lt $MAX ]; then
              echo "⏳ $DELAY saniye bekleniyor..."
              sleep $DELAY
              DELAY=$((DELAY * 2))
            fi
          done

          echo "⚠️ Supabase $MAX denemede yanıt vermedi (son HTTP: $STATUS)"
          echo "Supabase projesi duraklatılmış olabilir — dashboard'dan kontrol edin:"
          echo "https://supabase.com/dashboard/project/abtmfoetnhswccliuawn"
          exit 1
