name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check required secrets
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF; do
            if [ -z "${!name}" ]; then
              echo "::error::Required secret $name is empty or not set"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Deploy meta-leads function
        run: |
          supabase functions deploy meta-leads --no-verify-jwt \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Giriş öncesi token olmadığı için JWT doğrulaması kapalı; şifreyi fonksiyon kendisi kontrol eder
      - name: Deploy crm-login function
        run: |
          supabase functions deploy crm-login --no-verify-jwt \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Yalnızca giriş yapmış kullanıcılar çağırabilir (JWT doğrulaması açık)
      - name: Deploy crm-users function
        run: |
          supabase functions deploy crm-users \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # NOT: Edge Function secret'ları (META_ACCESS_TOKEN, META_VERIFY_TOKEN,
      # META_APP_SECRET, META_COMPANY_ID) yalnızca Supabase panelinden yönetilir.
      # Workflow bunları artık YAZMAZ; aksi halde her deploy'da canlıdaki
      # sistem kullanıcısı token'ı GitHub'daki eski değerle ezilirdi.
