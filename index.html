<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Turuncu Dental CRM</title>
<meta name="description" content="Turuncu Dental - Diş Turizmi CRM Sistemi"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#090d14;color:#dde4ef;height:100vh;display:flex;overflow:hidden}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:#090d14}
::-webkit-scrollbar-thumb{background:#1a2236;border-radius:4px}
input,select,textarea{font-family:'DM Sans',sans-serif}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#login-screen{position:fixed;inset:0;background:#090d14;display:flex;align-items:center;justify-content:center;z-index:200;flex-direction:column}
.login-box{background:#0d1320;border:1px solid #1a2236;border-radius:16px;padding:36px;width:360px;animation:fadeIn .3s ease}
.login-logo{font-size:26px;font-weight:900;background:linear-gradient(135deg,#f97316,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-1px;margin-bottom:4px}
.login-sub{font-size:12px;color:#3d5270;margin-bottom:28px}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-size:11px;color:#3d5270;margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.login-field input{width:100%;background:#131b2a;border:1px solid #1a2236;border-radius:9px;padding:10px 13px;color:#dde4ef;font-size:14px;outline:none;transition:border-color .15s}
.login-field input:focus{border-color:#f9731644}
.login-btn{width:100%;background:linear-gradient(135deg,#f97316,#fbbf24);color:#090d14;border:none;border-radius:9px;padding:11px;font-weight:800;font-size:14px;cursor:pointer;margin-top:4px;font-family:'DM Sans',sans-serif}
.login-err{color:#f87171;font-size:12px;margin-top:10px;text-align:center;min-height:16px}
.login-lang{display:flex;gap:8px;margin-bottom:20px}
.login-lang button{flex:1;padding:6px;border-radius:7px;border:1px solid #1a2236;background:#131b2a;color:#4a607d;font-size:12px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif}
.login-lang button.active{background:#1e2d40;color:#f97316;border-color:#f9731644}
.shake{animation:shake .3s ease}
#app{display:none;width:100%;height:100%}
#sidebar{width:210px;background:#0d1320;border-right:1px solid #1a2236;display:flex;flex-direction:column;flex-shrink:0}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{background:#0d1320;border-bottom:1px solid #1a2236;padding:11px 20px;display:flex;align-items:center;gap:10px;flex-shrink:0}
#content{flex:1;overflow-y:auto;padding:20px}
.logo{padding:16px 16px 10px;border-bottom:1px solid #1a2236}
.logo h1{font-size:17px;font-weight:900;background:linear-gradient(135deg,#f97316,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-sub{font-size:10px;color:#3d5270;margin-top:1px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#34d399;animation:pulse 2s infinite;display:inline-block;margin-right:5px}
.sync-label{font-size:11px;color:#34d399;font-weight:600}
.user-box{padding:10px 12px;border-bottom:1px solid #1a2236;display:flex;align-items:center;gap:8px}
.user-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-name{font-size:12px;font-weight:700;color:#dde4ef;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:10px;color:#3d5270}
.logout-btn{background:none;border:none;color:#3d5270;cursor:pointer;font-size:14px;padding:2px;flex-shrink:0}
.logout-btn:hover{color:#f87171}
.lang-box{padding:8px 12px;border-bottom:1px solid #1a2236;display:flex;gap:6px}
.lang-btn{flex:1;padding:5px;border-radius:7px;border:1px solid #1a2236;background:#131b2a;color:#4a607d;font-size:12px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif}
.lang-btn.active{background:#1e2d40;color:#f97316;border-color:#f9731644}
nav{padding:8px 0;flex:1;overflow-y:auto}
nav button{width:100%;display:flex;align-items:center;gap:10px;padding:9px 16px;background:transparent;color:#4a607d;border:none;cursor:pointer;font-size:13px;font-weight:500;border-left:2px solid transparent;transition:all .12s;text-align:left;font-family:'DM Sans',sans-serif}
nav button.active{background:#1a1208;color:#f97316;font-weight:700;border-left-color:#f97316}
nav button:hover:not(.active){color:#94a3b8}
.sidebar-footer{padding:10px 14px;border-top:1px solid #1a2236;font-size:11px;color:#3d5270;margin-top:auto}
.search-wrap{position:relative;max-width:300px;flex:1}
.search-wrap input{width:100%;background:#131b2a;border:1px solid #1a2236;border-radius:8px;padding:7px 28px 7px 28px;color:#dde4ef;font-size:13px;outline:none}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:#3d5270;font-size:13px;pointer-events:none}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:#4a607d;cursor:pointer;font-size:13px}
.btn{background:#f97316;color:#fff;border:none;border-radius:8px;padding:6px 13px;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif;transition:opacity .15s}
.btn.sec{background:#131b2a;color:#4a607d;border:1px solid #1a2236}
.btn.green{background:#34d399;color:#0d1320}
.btn:hover{opacity:.9}
.sm-btn{background:#131b2a;color:#4a607d;border:1px solid #1a2236;border-radius:6px;padding:3px 7px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif}
.sm-btn.danger{background:#f8717118;color:#f87171;border-color:#f8717133}
.sm-btn.success{background:#34d39918;color:#34d399;border-color:#34d39933}
.sm-btn.warn{background:#f59e0b18;color:#f59e0b;border-color:#f59e0b33}
.sm-btn.orange{background:#f9731618;color:#f97316;border-color:#f9731633}
.card{background:#0d1320;border:1px solid #1a2236;border-radius:12px;padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:13px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.kpi-val{font-size:22px;font-weight:900;letter-spacing:-1px}
.kpi-lbl{font-size:11px;color:#dde4ef;margin-top:3px;font-weight:600}
.kpi-sub{font-size:10px;color:#3d5270;margin-top:1px}
.badge{font-size:11px;padding:2px 9px;border-radius:20px;display:inline-block;white-space:nowrap}
.section-title{font-weight:700;margin-bottom:12px;font-size:13px;color:#f97316}
.modal-overlay{position:fixed;inset:0;background:#00000099;display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:#0d1320;border:1px solid #1a2236;border-radius:14px;padding:24px;width:440px;max-height:90vh;overflow-y:auto;max-width:95vw}
.modal-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-title span{font-weight:800;font-size:15px}
.modal-title button{background:none;border:none;color:#3d5270;font-size:17px;cursor:pointer}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:#3d5270;margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.field input,.field select,.field textarea{width:100%;background:#131b2a;border:1px solid #1a2236;border-radius:8px;padding:7px 10px;color:#dde4ef;font-size:13px;outline:none;font-family:'DM Sans',sans-serif}
.field select option{background:#131b2a}
.field textarea{resize:vertical}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions{display:flex;gap:9px;margin-top:16px}
.modal-actions button{flex:1;padding:8px;border-radius:8px;cursor:pointer;font-weight:700;font-size:13px;border:none;font-family:'DM Sans',sans-serif}
.modal-actions .cancel{background:#131b2a;color:#4a607d;border:1px solid #1a2236}
.modal-actions .save{background:#f97316;color:#fff;flex:2}
.toast-wrap{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:13px 28px;border-radius:14px;font-size:15px;font-weight:700;animation:fadeIn .2s ease;box-shadow:0 6px 24px #0009;letter-spacing:.01em;white-space:nowrap}
.toast.ok{background:#0d2b1a;border:2px solid #34d39966;color:#34d399}
.toast.warn{background:#2b1f0a;border:2px solid #f59e0b66;color:#f59e0b}
.toast.err{background:#2b0f0f;border:2px solid #f8717166;color:#f87171}
.confirm-overlay{position:fixed;inset:0;background:#000000aa;z-index:2000;display:flex;align-items:center;justify-content:center}
.confirm-box{background:#0d1320;border:1px solid #1a2236;border-radius:16px;padding:30px 28px;max-width:340px;width:90%;text-align:center;box-shadow:0 12px 40px #000c;animation:fadeIn .15s ease}
.confirm-box .conf-msg{font-size:14px;color:#dde4ef;font-weight:600;margin:12px 0 22px;line-height:1.6}
.confirm-box .conf-btns{display:flex;gap:10px}
.confirm-box .conf-no{flex:1;padding:12px;background:#131b2a;color:#94a3b8;border:1px solid #1a2236;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif}
.confirm-box .conf-yes{flex:1;padding:12px;background:linear-gradient(135deg,#f97316,#fbbf24);color:#090d14;border:none;border-radius:9px;font-size:14px;font-weight:800;cursor:pointer;font-family:'DM Sans',sans-serif}
.confirm-box .conf-yes.danger{background:linear-gradient(135deg,#ef4444,#f87171)}
#patient-overlay{position:fixed;inset:0;background:#090d14;z-index:50;display:none;flex-direction:column;overflow:hidden}
.pt-header{background:#0d1320;border-bottom:1px solid #1a2236;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.pt-tabs{display:flex;gap:0;border-bottom:1px solid #1a2236;background:#0d1320;padding:0 20px;flex-shrink:0;overflow-x:auto}
.pt-tab{padding:10px 18px;font-size:13px;font-weight:600;color:#4a607d;border:none;background:transparent;cursor:pointer;border-bottom:2px solid transparent;font-family:'DM Sans',sans-serif;transition:all .15s;white-space:nowrap}
.pt-tab.active{color:#f97316;border-bottom-color:#f97316}
.pt-body{flex:1;overflow-y:auto;padding:20px}
.tooth-chart-wrap{overflow-x:auto;padding:10px 0}
.tooth-row{display:flex;align-items:flex-end;gap:2px;justify-content:center;margin-bottom:3px}
.tooth{width:34px;min-height:42px;border:2px solid #1a2236;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:pointer;font-size:9px;font-weight:700;color:#3d5270;transition:all .12s;position:relative;background:#131b2a;padding-bottom:3px;gap:2px}
.tooth:hover{border-color:#f97316;color:#dde4ef}
.tooth-num{font-size:8px;font-weight:800;line-height:1}
.tooth-icon{font-size:12px;line-height:1}
.tooth-sep{width:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#1a2236;font-size:16px}
.tooth-popup{position:fixed;background:#0d1320;border:1px solid #1a2236;border-radius:10px;padding:14px;z-index:300;min-width:220px;box-shadow:0 8px 32px #00000099;animation:fadeIn .15s ease}
.status-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.status-tab{padding:5px 12px;border-radius:20px;border:1px solid #1a2236;background:#131b2a;color:#4a607d;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}
.status-tab.active{border-color:#f9731644;background:#f9731618;color:#f97316}
.data-table{width:100%;border-collapse:collapse}
.data-table th{font-size:10px;font-weight:700;color:#3d5270;text-transform:uppercase;letter-spacing:.5px;padding:8px 12px;text-align:left;border-bottom:1px solid #1a2236;white-space:nowrap}
.data-table td{padding:9px 12px;font-size:13px;border-bottom:1px solid #0f1825}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:#0f1825}
.empty{text-align:center;color:#3d5270;padding:36px 0;font-size:13px}
.loading{display:flex;align-items:center;justify-content:center;height:80%;flex-direction:column;gap:16px}
.spinner{font-size:32px;animation:spin 1s linear infinite;color:#f97316}
.stat-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #1a2236}
.stat-row span:first-child{font-size:12px;color:#4a607d}
.stat-row span:last-child{font-size:13px;font-weight:700}
.toggle-group{display:flex;border:1px solid #1a2236;border-radius:8px;overflow:hidden;width:fit-content}
.toggle-btn{padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:#131b2a;color:#4a607d;font-family:'DM Sans',sans-serif}
.toggle-btn.active{background:#f9731622;color:#f97316}
.apt-slot{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#0d1320;border:1px solid #1a2236;border-radius:10px;margin-bottom:7px}
.time-badge{background:#131b2a;border:1px solid #1a2236;border-radius:6px;padding:4px 10px;font-size:13px;font-weight:800;color:#dde4ef;min-width:56px;text-align:center;flex-shrink:0}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:#4a607d;cursor:pointer;padding:4px 8px;border-radius:7px;border:1.5px solid transparent;transition:all .12s;user-select:none}
.legend-item:hover{color:#dde4ef;background:#131b2a}
.legend-item.active{color:#f97316;background:#1a22366e;border-color:#f97316;font-weight:700}
.legend-dot{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.tooth.paint-mode{cursor:crosshair!important}
.paint-hint{font-size:11px;color:#f97316;background:#1a223666;border:1px solid #f9731655;border-radius:8px;padding:5px 12px;display:flex;align-items:center;gap:6px;animation:fadeIn .2s ease}
</style>
</head>
<body>
<div id="toast-container" class="toast-wrap"></div>
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">🦷 Turuncu Dental</div>
    <div class="login-sub" id="login-sub">Diş Turizmi Yönetim Sistemi</div>
    <div class="login-lang">
      <button class="active" id="ll-tr" onclick="setLang('tr');setLoginLang('tr')">🇹🇷 Türkçe</button>
      <button id="ll-en" onclick="setLang('en');setLoginLang('en')">🇬🇧 English</button>
    </div>
    <div class="login-field">
      <label id="lbl-username">Kullanıcı Adı</label>
      <input type="text" id="login-username" placeholder="admin" onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>
    <div class="login-field">
      <label id="lbl-password">Şifre</label>
      <input type="password" id="login-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>
    <button class="login-btn" id="login-btn" onclick="doLogin()">Giriş Yap</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>
<div id="app">
  <div id="sidebar">
    <div class="logo">
      <h1>🦷 Turuncu Dental</h1>
      <div class="logo-sub">Diş Turizmi CRM</div>
      <div style="margin-top:6px"><span class="sync-dot"></span><span class="sync-label" id="sync-label">Canlı</span><span id="syncing-label" style="font-size:10px;color:#3d5270;margin-left:6px;display:none">kaydediliyor...</span></div>

    <div class="lang-box">
      <button class="lang-btn active" id="lang-tr" onclick="setLang('tr')">🇹🇷 TR</button>

    <div class="user-box">
      <div class="user-avatar" id="user-avatar" style="background:#f9731622;color:#f97316">A</div>

        <div class="user-role" id="user-role">admin</div>
      </div>
      <button class="logout-btn" onclick="doLogout()" title="Çıkış">⏻</button>
    </div>
    <nav id="nav">
      <button data-tab="dashboard" class="active" onclick="setTab('dashboard')">▦ &nbsp;<span class="nav-lbl" data-key="navDashboard">Panel</span></button>
      <button data-tab="patients" onclick="setTab('patients')">👥 &nbsp;<span class="nav-lbl" data-key="navPatients">Hastalar</span></button>
      <button data-tab="events" onclick="setTab('events')">📅 &nbsp;<span class="nav-lbl" data-key="navEvents">Etkinlikler</span></button>
      <button data-tab="appointments" onclick="setTab('appointments')">🕐 &nbsp;<span class="nav-lbl" data-key="navAppointments">Randevular</span></button>
      <button data-tab="treatments" onclick="setTab('treatments')">🦷 &nbsp;<span class="nav-lbl" data-key="navTreatments">Tedaviler</span></button>
      <button data-tab="reports" onclick="setTab('reports')">↗ &nbsp;<span class="nav-lbl" data-key="navReports">Raporlar</span></button>
      <button data-tab="users" id="nav-users" style="display:none" onclick="setTab('users')">👤 &nbsp;<span class="nav-lbl" data-key="navUsers">Kullanıcılar</span></button>
    </nav>
    <div class="sidebar-footer" id="sidebar-footer">...</div>
  </div>
  <div id="main">
    <div id="topbar">
      <div id="page-title" style="font-size:15px;font-weight:700;min-width:110px">Panel</div>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Ara..." oninput="onSearch(this.value)"/>
        <button class="search-clear" id="search-clear" style="display:none" onclick="clearSearch()">✕</button>
      </div>
      <div style="flex:1"></div>
      <div id="topbar-actions"></div>
    </div>
    <div id="content"><div class="loading"><div class="spinner">🦷</div></div></div>
  </div>
</div>
<div id="patient-overlay">
  <div class="pt-header">
    <button class="sm-btn" onclick="closePatient()" style="padding:5px 10px;font-size:12px">← Geri</button>
    <div style="flex:1;min-width:0">
      <div id="pt-name" style="font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
      <div id="pt-meta" style="font-size:11px;color:#4a607d;margin-top:1px"></div>
    </div>
    <div id="pt-status-badge"></div>
    <button class="btn" style="font-size:12px" onclick="saveCurrentPatient()">💾 Kaydet</button>
  </div>
  <div class="pt-tabs" id="pt-tabs"></div>
  <div class="pt-body" id="pt-body"></div>
</div>

function bookingTotal(p){
  const txSub=(p.booking?.treatments||[]).reduce((s,tr)=>s+(tr.qty||1)*(tr.price||0),0);
  const acSub=(p.booking?.accommodations||[]).reduce((s,a)=>s+(a.nights||1)*(a.pricePerNight||0),0);
  const trSub=(p.booking?.travels||[]).reduce((s,tr)=>s+(tr.persons||1)*(tr.price||0),0);
  return txSub+acSub+trSub-(p.booking?.discount||0);
}

// ── SUPABASE CRUD  (localStorage = primary; Supabase = initial seed only)
async function dbGet(table){
  // localStorage is always the source of truth once it has data
  try{const local=localStorage.getItem("crm_"+table);if(local)return JSON.parse(local);}catch{}
  // First use: pull from Supabase to seed localStorage
  try{
    const r=await fetch(`${SUPA_URL}/rest/v1/${table}?select=*`,{headers:H});
    if(r.ok){const rows=await r.json();if(rows&&rows.length>0){localStorage.setItem("crm_"+table,JSON.stringify(rows));return rows;}}
  }catch{}
  return null;
}
async function dbSet(table,data){
  try{localStorage.setItem("crm_"+table,JSON.stringify([{id:1,data}]));}catch{}
  try{await fetch(`${SUPA_URL}/rest/v1/${table}`,{method:"POST",headers:{...H,"Prefer":"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({id:1,data})});}catch{}
}
const TABLE_STATE={customers:"patients",deals:"events",tasks:"appointments",history:"treatments"};
async function persist(table){document.getElementById("syncing-label").style.display="inline";await dbSet(table,state[TABLE_STATE[table]||table]);document.getElementById("syncing-label").style.display="none";updateFooter();}
async function loadAll(){
  const [p,e,a,tr]=await Promise.all([dbGet("customers"),dbGet("deals"),dbGet("tasks"),dbGet("history")]);
  // Guard: if data is not a valid array, fall back to seed (prevents crash from corrupted localStorage)
  state.patients=Array.isArray(p?.[0]?.data)?p[0].data:SEED_PATIENTS;
  state.events=Array.isArray(e?.[0]?.data)?e[0].data:SEED_EVENTS;
  state.appointments=Array.isArray(a?.[0]?.data)?a[0].data:SEED_APPOINTMENTS;
  state.treatments=Array.isArray(tr?.[0]?.data)?tr[0].data:SEED_TREATMENTS;
  if(!p||!p[0])dbSet("customers",SEED_PATIENTS);
  if(!e||!e[0])dbSet("deals",SEED_EVENTS);
  if(!a||!a[0])dbSet("tasks",SEED_APPOINTMENTS);
  if(!tr||!tr[0])dbSet("history",SEED_TREATMENTS);
}

async function doLogin(){

  if(!username||!password){document.getElementById("login-err").textContent=t.loginErr;shake();return;}

function renderPtAssessment(p){
  const a=p.assessment||{currentCondition:{},treatmentPlan:{},dentistNotes:""};
  const chart=a[chartMode]||{};
  const gId=chartMode;
  function toothHTML(num){
    const cond=chart[num]||"healthy";
    const isMissing=cond==="missing";
    const isHealthy=!chart[num]||cond==="healthy";
    const condColor=TOOTH_COLORS[cond]||"transparent";
    const sh=TOOTH_SVG_DATA[getToothSVGKey(num)];
    const isUpper=num>=11&&num<=28;
    const numStyle="font-size:7px;font-weight:800;color:#3d5270;height:9px;line-height:9px;text-align:center;width:34px";
    const cursor=paintBrush?"crosshair":"pointer";
    let svgContent;
    // Parse compound conditions like "implant+crown"
    const isCompound=cond.startsWith&&cond.startsWith("implant+");
    const crownCond=isCompound?cond.split("+")[1]:null;
    const isImplant=cond==='implant'||isCompound;
    if(isHealthy&&!isMissing){
      // Healthy: use real tooth image
      const img=TOOTH_IMAGES[getToothSVGKey(num)];
      const ix=(34-img.w)/2;
      svgContent=`<image href="data:image/png;base64,${img.d}" x="${ix.toFixed(1)}" y="1" width="${img.w}" height="${img.h}"/>`;
    } else if(isImplant){
      // Implant: screw in root area only
      const rootH=isUpper?sh.gY:(70-sh.gY);
      const iw=30;
      const ih=Math.min(Math.round(IMPLANT_IMG.h*(iw/IMPLANT_IMG.w)), rootH-2);
      const ix=(34-iw)/2;
      const iy=isUpper?sh.gY-ih-1:sh.gY+2;
      const flip=isUpper
        ?`transform="translate(${(ix+iw/2).toFixed(1)},${(iy+ih/2).toFixed(1)}) scale(1,-1) translate(${-(ix+iw/2).toFixed(1)},${-(iy+ih/2).toFixed(1)})"`
        :'';
      const screwEl=`<image href="data:image/png;base64,${IMPLANT_IMG.d}" x="${ix.toFixed(1)}" y="${iy.toFixed(1)}" width="${iw}" height="${ih}" ${flip}/>`;
      if(isCompound){
        // Crown on top of implant — use crown image if molar, else colored path
        const cc=crownCond;
        const svgKey=getToothSVGKey(num);
        const isMolarTooth=svgKey==='u-molar'||svgKey==='l-molar';
        let crownPart;
        if(cc==='crown'&&isMolarTooth){
          const ci=CROWN_MOLAR_IMG;
          const ciw=32;const cih=Math.round(ci.h*(ciw/ci.w));
          const cix=(34-ciw)/2;
          const ciy=isUpper?sh.gY+Math.round((70-sh.gY-cih)/2):Math.round((sh.gY-cih)/2);
          crownPart=`<image href="data:image/png;base64,${ci.d}" x="${cix.toFixed(1)}" y="${ciy}" width="${ciw}" height="${cih}"/>`;
        } else {
          const ccColor=TOOTH_COLORS[cc]||"#888";
          const ccIco=TOOTH_ICONS[cc]||'';
          const icoY=isUpper?sh.gY+20:sh.gY-12;
          const ccIcoEl=ccIco?`<text x="17" y="${icoY}" text-anchor="middle" font-size="9" dominant-baseline="middle" style="pointer-events:none">${ccIco}</text>`:'';
          crownPart=`<path d="${sh.crown}" fill="${ccColor}dd" stroke="${ccColor}" stroke-width="0.8"/>`+ccIcoEl;
        }
        svgContent=screwEl+crownPart;
      } else {
        svgContent=screwEl; // bare implant — no crown
      }
    } else {
      const svgKey=getToothSVGKey(num);
      const isMolarTooth=svgKey==='u-molar'||svgKey==='l-molar';
      // Crown condition on molar: use crown image + natural roots
      if(cond==='crown'&&isMolarTooth&&!isMissing){
        const rFill=`url(#tooth-rg-${gId})`;
        const roots=sh.rx.map(d=>`<path d="${d}" fill="${rFill}" stroke="#60500e" stroke-width="0.7"/>`).join('');
        const ci=CROWN_MOLAR_IMG;
        const ciw=32;const cih=Math.round(ci.h*(ciw/ci.w));
        const cix=(34-ciw)/2;
        const ciy=isUpper?sh.gY+Math.round((70-sh.gY-cih)/2):Math.round((sh.gY-cih)/2);
        const crownImg=`<image href="data:image/png;base64,${ci.d}" x="${cix.toFixed(1)}" y="${ciy}" width="${ciw}" height="${cih}"/>`;
        svgContent=roots+crownImg;
      } else {
        // Other conditions / missing: SVG paths
        const cFill=isMissing?"#111827":condColor+"dd";
        const cStroke=isMissing?"#37415188":condColor;
        const rFill=`url(#tooth-rg-${gId})`;
        const roots=sh.rx.map(d=>`<path d="${d}" fill="${rFill}" stroke="#60500e" stroke-width="0.7"/>`).join('');
        const crown=isMissing
          ?`<path d="${sh.crown}" fill="${cFill}" stroke="#374151" stroke-width="0.7" stroke-dasharray="3,2"/>`
          :`<path d="${sh.crown}" fill="${cFill}" stroke="${cStroke}" stroke-width="0.8"/>`;
        const ico=TOOTH_ICONS[cond]||'';
        const icoY=isUpper?sh.gY+20:sh.gY-12;
        const icoEl=ico?`<text x="17" y="${icoY}" text-anchor="middle" font-size="9" dominant-baseline="middle" style="pointer-events:none">${ico}</text>`:'';
        svgContent=`${roots}${crown}${icoEl}`;
      }
    }
    const svgOp=isMissing?"0.18":"1";
    const glow=isHealthy?"#f97316":condColor;
    return`<div id="tooth-${num}" onclick="toothClick(event,${num})"
      style="display:flex;flex-direction:column;align-items:center;cursor:${cursor};user-select:none"
      onmouseenter="this.style.filter='brightness(1.18) drop-shadow(0 0 4px ${glow})'"
      onmouseleave="this.style.filter=''">
      ${isUpper?`<div style="${numStyle}">${num}</div>`:''}
      <svg viewBox="0 0 34 70" width="34" height="70" style="opacity:${svgOp};overflow:visible">${svgContent}</svg>
      ${!isUpper?`<div style="${numStyle}">${num}</div>`:''}
    </div>`;

  const paintHint=paintBrush&&paintBrush!=="healthy"?`<div class="paint-hint">${TOOTH_ICONS[paintBrush]||"○"} <strong>${condLabel(paintBrush)}</strong> fırçası aktif — dişlere tıkla, iptal için tekrar tıkla</div>`:paintBrush==="healthy"?`<div class="paint-hint">✕ <strong>Temizle</strong> fırçası aktif — tıklanan dişi sıfırlar</div>`:"";
  return`<div style="max-width:800px;display:flex;flex-direction:column;gap:14px">

        <div class="toggle-group">

        <radialGradient id="tooth-cg-currentCondition" cx="40%" cy="35%" r="70%" fx="32%" fy="26%">
          <stop offset="0%" stop-color="#ffffff"/><stop offset="45%" stop-color="#e8e8e4"/>

function toothClick(e,num){
  e.stopPropagation();
  if(paintBrush!==null){setToothCond(num,paintBrush);return;}
  document.querySelectorAll(".tooth-popup").forEach(p=>p.remove());
  const p=getPatient(currentPatientId);if(!p)return;
  const a=p.assessment||{currentCondition:{},treatmentPlan:{}};
  const chart=a[chartMode]||{};
  const popupKeys=chartMode==="currentCondition"
    ?["cavity","crown","missing","root","implant","root_canal","veneer","filling","bridge","extraction"]
    :["healthy","cavity","crown","missing","implant","root_canal","veneer","filling","bridge","extraction"];
  const popup=document.createElement("div");
  popup.className="tooth-popup";
  const rect=e.currentTarget.getBoundingClientRect();
  let left=rect.left+rect.width/2-110,top=rect.bottom+8;
  if(left<8)left=8;
  if(left+220>window.innerWidth)left=window.innerWidth-228;
  if(top+200>window.innerHeight)top=rect.top-208;
  popup.style.left=left+"px";popup.style.top=top+"px";
  const hasCond=chart[num]&&chart[num]!=="healthy";
  const clearRow=chartMode==="currentCondition"&&hasCond?`<button onclick="setToothCond(${num},'healthy')" style="grid-column:1/-1;padding:5px 8px;border-radius:6px;border:1px dashed #3d5270;background:#131b2a;color:#3d5270;font-size:11px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif">✕ Temizle</button>`:"";
  popup.innerHTML=`<div style="font-size:11px;font-weight:800;color:#f97316;margin-bottom:8px">Diş ${num} — ${chartMode==="currentCondition"?t.currentCondition:t.treatmentPlan}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:5px">
    ${popupKeys.map(k=>{const cur=chart[num]===k||(!chart[num]&&k==="healthy");return`<button onclick="setToothCond(${num},'${k}')" style="padding:5px 8px;border-radius:6px;border:1px solid ${cur?"#f97316":"#1a2236"};background:${cur?"#f9731622":"#131b2a"};color:${cur?"#f97316":"#4a607d"};font-size:11px;font-weight:600;cursor:pointer;text-align:left;font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:4px"><span>${TOOTH_ICONS[k]||"○"}</span><span>${condLabel(k)}</span></button>`}).join("")}
    ${clearRow}
    </div>`;
  document.body.appendChild(popup);
  setTimeout(()=>document.addEventListener("click",()=>popup.remove(),{once:true}),10);
}

function setToothCond(num,cond){
  document.querySelectorAll(".tooth-popup").forEach(p=>p.remove());
  const p=getPatient(currentPatientId);if(!p)return;
  if(!p.assessment)p.assessment={currentCondition:{},treatmentPlan:{},dentistNotes:""};
  if(!p.assessment[chartMode])p.assessment[chartMode]={};
  const existing=p.assessment[chartMode][num];
  // Crown-type conditions that can sit on top of an implant
  const crownTypes=["crown","veneer","cavity","filling","bridge"];
  if(existing==="implant"&&crownTypes.includes(cond)){
    // Add crown on top of implant
    p.assessment[chartMode][num]="implant+"+cond;
  } else if(existing&&existing.startsWith("implant+")&&cond===existing.split("+")[1]){
    // Toggle off the crown part → back to bare implant
    p.assessment[chartMode][num]="implant";
  } else if(existing&&existing.startsWith("implant+")&&cond==="implant"){
    // Remove implant → keep only crown part
    p.assessment[chartMode][num]=existing.split("+")[1];
  } else if(existing&&existing.startsWith("implant+")&&cond==="healthy"){
    delete p.assessment[chartMode][num];
  } else if(cond==="healthy"||existing===cond){
    delete p.assessment[chartMode][num];
  } else {
    p.assessment[chartMode][num]=cond;
  }
  persist("customers");
  renderPtBody();
}
function setPaintBrush(k){
  paintBrush=(paintBrush===k)?null:k;
  renderPtBody();
}

  const statusColors=statusKeys.map(s=>STATUS_COLORS[s]);
  const statusEl=document.getElementById("statusChart");
  if(statusEl){if(charts.status)charts.status.destroy();charts.status=new Chart(statusEl,{type:"bar",data:{labels:statusKeys.map(s=>statusLabel(s)),datasets:[{data:statusData,backgroundColor:statusColors,borderRadius:5}]},options:{plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{color:"#3d5270",font:{size:10}}},y:{grid:{color:"#1a2236"},ticks:{color:"#3d5270",stepSize:1}}},responsive:true,maintainAspectRatio:false}});}
  const cats={};state.treatments.forEach(tr=>{const rev=state.patients.filter(p=>p.status==="booked").reduce((s,p)=>{const btr=(p.booking?.treatments||[]).find(bt=>bt.treatmentId===tr.id);return s+(btr?(btr.qty||1)*(btr.price||0):0);},0);if(rev>0)cats[tr.category]=(cats[tr.category]||0)+rev;});
  const catEl=document.getElementById("catChart");

  const countries={};state.patients.forEach(p=>{if(p.country)countries[p.country]=(countries[p.country]||0)+1;});

// ── BOOKING HELPERS
function ensureBooking(p){if(!p.booking)p.booking={treatments:[],accommodations:[],travels:[],discount:0,deposit:0,notes:""}; if(!p.booking.accommodations)p.booking.accommodations=[]; if(!p.booking.travels)p.booking.travels=[];}
function addBookingItem(type,treatmentId){
  const p=getPatient(currentPatientId);if(!p)return;
  const tr=getTreatment(treatmentId);if(!tr)return;
  ensureBooking(p);
  const existing=p.booking.treatments.find(bt=>bt.treatmentId===treatmentId);
  if(existing)existing.qty=(existing.qty||1)+1;
  else p.booking.treatments.push({treatmentId:tr.id,name:tr.name,qty:1,price:tr.salePrice});
  renderPtBody();
}
function addBookingAccommodation(){
  const p=getPatient(currentPatientId);if(!p)return;
  const id=+document.getElementById("pb-accom-sel")?.value;if(!id)return;
  const nights=+document.getElementById("pb-accom-nights")?.value||1;
  const prov=getTreatment(id);if(!prov)return;
  ensureBooking(p);
  p.booking.accommodations.push({providerId:prov.id,name:prov.name,nights,pricePerNight:prov.salePrice});
  renderPtBody();
}
function addBookingTravel(){
  const p=getPatient(currentPatientId);if(!p)return;
  const id=+document.getElementById("pb-travel-sel")?.value;if(!id)return;
  const persons=+document.getElementById("pb-travel-persons")?.value||1;
  const prov=getTreatment(id);if(!prov)return;
  ensureBooking(p);
  p.booking.travels.push({providerId:prov.id,name:prov.name,persons,price:prov.salePrice});
  renderPtBody();
}
function removeBookingItem(arr,idx){const p=getPatient(currentPatientId);if(!p?.booking)return;p.booking[arr].splice(idx,1);renderPtBody();}
function updateBookingQty(arr,idx,val,field="qty"){
  const p=getPatient(currentPatientId);if(!p?.booking?.[arr]?.[idx])return;
  p.booking[arr][idx][field]=Math.max(1,val||1);renderPtBody();

function updateBookingDiscount(val){const p=getPatient(currentPatientId);if(!p?.booking)return;p.booking.discount=val||0;renderPtBody();}
function updateBookingDeposit(val){const p=getPatient(currentPatientId);if(!p?.booking)return;p.booking.deposit=val||0;renderPtBody();}

    <div class="field"><label>${t.fevent}</label><select id="am-eventId"><option value="">—</option>${evtOpts}</select></div>
    <div class="field"><label>${t.aptPatient}</label><select id="am-patientId"><option value="">—</option>${patOpts}</select></div>
    <div class="field"><label>${t.aptTime}</label><input id="am-time" type="time" value="09:00"/></div>`;
  makeModal(t.newAppointment,body,"saveAppointment()");
}
async function saveAppointment(){
  const patientId=+document.getElementById("am-patientId")?.value;const eventId=+document.getElementById("am-eventId")?.value;
  if(!patientId||!eventId)return;
  const pat=getPatient(patientId);
  state.appointments.push({id:Date.now(),eventId,patientId,patientName:pat?.name||"",time:document.getElementById("am-time").value,status:"scheduled"});
  await persist("tasks");toast("✅ "+t.added);closeModal();render();
}
async function setAptStatus(id,status){
  state.appointments=state.appointments.map(a=>a.id==id?{...a,status}:a);
  await persist("tasks");toast("✅ "+t.saved);render();
}
async function deleteAppointment(id){if(!await confirmDialog("Bu randevuyu silmek istiyor musunuz?",true))return;state.appointments=state.appointments.filter(a=>a.id!==id);await persist("tasks");toast("🗑️ Randevu silindi","warn");render();}

// ── TREATMENTS
function openTreatmentModal(editId,forcedType){
  const tr=editId?getTreatment(editId):null;
  const type=forcedType||(tr?.type||"treatment");
  let body="";
  if(type==="treatment"){
    body=`
      <div class="field"><label>${t.tname}</label><input id="trm-name" value="${tr?.name||""}"/></div>
      <div class="field"><label>${t.tdesc}</label><input id="trm-desc" value="${tr?.description||""}"/></div>
      <div class="field"><label>${t.tcategory}</label><input id="trm-cat" value="${tr?.category||""}" placeholder="Estetik, Restorasyon, İmplant..."/></div>
      <div class="field-row">
        <div class="field"><label>${t.tclinicCost}</label><input type="number" id="trm-clinicCost" value="${tr?.clinicCost||0}"/></div>
        <div class="field"><label>${t.tsalePrice}</label><input type="number" id="trm-salePrice" value="${tr?.salePrice||0}"/></div>
      </div>`;
  } else if(type==="accommodation"){
    body=`
      <div class="field"><label>${t.aname}</label><input id="trm-name" value="${tr?.name||""}" placeholder="Hilton, Marriott..."/></div>
      <div class="field"><label>${t.tdesc}</label><input id="trm-desc" value="${tr?.description||""}" placeholder="5 yıldızlı otel, özel suit..."/></div>
      <div class="field"><label>${t.acity} / Bölge</label><input id="trm-cat" value="${tr?.category||""}" placeholder="İstanbul, Antalya..."/></div>
      <div class="field"><label>${t.apricePerNight}</label><input type="number" id="trm-salePrice" value="${tr?.salePrice||0}"/></div>
      <input type="hidden" id="trm-clinicCost" value="0"/>`;
  } else {
    body=`
      <div class="field"><label>${t.trvName}</label><input id="trm-name" value="${tr?.name||""}" placeholder="Turkish Airlines, Transfer Firması..."/></div>
      <div class="field"><label>${t.trvRoute}</label><input id="trm-desc" value="${tr?.description||""}" placeholder="Londra → İstanbul, Havalimanı transferi..."/></div>
      <div class="field"><label>${t.trvType}</label><input id="trm-cat" value="${tr?.category||""}" placeholder="Uçuş, Transfer, Kiralık Araç..."/></div>
      <div class="field"><label>${t.trvPrice}</label><input type="number" id="trm-salePrice" value="${tr?.salePrice||0}"/></div>
      <input type="hidden" id="trm-clinicCost" value="0"/>`;
  }
  body+=`<div style="display:flex;align-items:center;gap:8px;margin-top:8px"><input type="checkbox" id="trm-active" ${tr?.active!==false?"checked":""} style="accent-color:#f97316;width:15px;height:15px"/><label style="font-size:13px;cursor:pointer">Aktif</label></div>`;
  const title=type==="accommodation"?(editId?t.editAccommodation:t.newAccommodation):type==="travel"?(editId?t.editTravel:t.newTravel):(editId?t.editTreatment:t.newTreatment);
  makeModal(title,body,`saveTreatment(${editId||0},'${type}')`);
}
async function saveTreatment(editId,type){
  const name=document.getElementById("trm-name")?.value?.trim();if(!name)return;
  if(!await confirmDialog(editId?"Bu kaydı güncellemek istiyor musunuz?":"Yeni kayıt eklemek istiyor musunuz?"))return;
  const item={name,description:document.getElementById("trm-desc").value,category:document.getElementById("trm-cat").value,clinicCost:+document.getElementById("trm-clinicCost").value||0,salePrice:+document.getElementById("trm-salePrice").value||0,active:document.getElementById("trm-active").checked,type:type||"treatment"};
  if(editId){state.treatments=state.treatments.map(tr=>tr.id==editId?{...tr,...item}:tr);}
  else{state.treatments.push({...item,id:Date.now()});}
  await persist("history");toast("✅ "+t.saved);closeModal();render();
}
async function deleteTreatment(id){if(!canEdit())return;if(!await confirmDialog("Bu kaydı silmek istiyor musunuz?",true))return;state.treatments=state.treatments.filter(tr=>tr.id!==id);await persist("history");toast("🗑️ Kayıt silindi","warn");render();}

// ── USERS
function openUserModal(editId){
  const u=editId?state.users.find(u=>u.id===editId):null;
  const roleOpts=[["admin",t.roleAdmin],["satis",t.roleSales],["okuyucu",t.roleReader]].map(([v,l])=>`<option value="${v}"${u?.role===v?" selected":""}>${l}</option>`).join("");
  const body=`
    <div class="field"><label>${t.fdisplayName}</label><input id="u-displayName" value="${u?.display_name||""}"/></div>
    <div class="field"><label>${t.loginUser}</label><input id="u-username" value="${u?.username||""}" ${editId?"readonly style='opacity:.5;cursor:not-allowed'":""}/></div>
    <div class="field"><label>${editId?t.fnewPass:t.fpassword}</label><input id="u-password" type="password" placeholder="${editId?t.fnewPassHint:"••••••••"}"/>${editId?`<div style="font-size:10px;color:#3d5270;margin-top:3px">${t.fnewPassHint}</div>`:""}</div>
    <div class="field"><label>${t.fRole}</label><select id="u-role">${roleOpts}</select></div>`;
  makeModal(editId?t.editUser:t.newUser,body,`saveUser(${editId||0})`);
}
async function saveUser(editId){
  const username=document.getElementById("u-username")?.value?.trim();const displayName=document.getElementById("u-displayName")?.value?.trim();const password=document.getElementById("u-password")?.value;const role=document.getElementById("u-role")?.value;
  if(!username){toast(t.usernameRequired,"err");return;}
  if(!editId&&!password){toast(t.passRequired,"err");return;}
  if(editId){
    const upd={display_name:displayName,role};if(password)upd.password=password;
    try{const r=await fetch(`${SUPA_URL}/rest/v1/crm_users?id=eq.${editId}`,{method:"PATCH",headers:{...H,"Prefer":"return=minimal"},body:JSON.stringify(upd)});if(!r.ok){toast("Güncelleme başarısız","err");return;}
    state.users=state.users.map(u=>u.id===editId?{...u,...upd}:u);
    if(editId===currentUser.id){currentUser={...currentUser,display_name:displayName,role};sessionStorage.setItem("crm_user",JSON.stringify(currentUser));const color=ROLE_COLORS[role]||"#f97316";document.getElementById("user-name").textContent=displayName||username;document.getElementById("user-avatar").textContent=(displayName||username)[0].toUpperCase();document.getElementById("user-role").textContent=role;document.getElementById("user-role").style.color=color;}
    toast(t.userUpdated);}catch{toast("Hata","err");return;}
  } else {
    if(state.users.some(u=>u.username===username)){toast(t.usernameExists,"err");return;}
    try{const r=await fetch(`${SUPA_URL}/rest/v1/crm_users`,{method:"POST",headers:{...H,"Prefer":"return=representation"},body:JSON.stringify({username,password,role,display_name:displayName})});if(!r.ok){toast("Eklenemedi","err");return;}const added=(await r.json());state.users.push({id:(Array.isArray(added)?added[0]:added).id,username,role,display_name:displayName});toast(t.userAdded);}catch{toast("Hata","err");return;}
  }
  closeModal();render();
}
async function deleteUser(id){
  if(!canManageUsers())return;if(id===currentUser.id){toast(t.cantDeleteSelf,"err");return;}
  try{const r=await fetch(`${SUPA_URL}/rest/v1/crm_users?id=eq.${id}`,{method:"DELETE",headers:H});if(!r.ok){toast("Silinemedi","err");return;}state.users=state.users.filter(u=>u.id!==id);toast(t.userDeleted,"warn");render();}catch{toast("Hata","err");}
}

// ── PDF QUOTE
async function downloadQuotePDF(patientId){
  const p=getPatient(patientId);if(!p)return;
  const b=p.booking||{};const treatments=b.treatments||[];
  const txSub=treatments.reduce((s,tr)=>s+(tr.qty||1)*(tr.price||0),0);
  const acSub=(b.accommodations||[]).reduce((s,a)=>s+(a.nights||1)*(a.pricePerNight||0),0);
  const trSub=(b.travels||[]).reduce((s,tr)=>s+(tr.persons||1)*(tr.price||0),0);
  const sub=txSub+acSub+trSub;
  const total=sub-(b.discount||0);const balance=total-(b.deposit||0);
  const dateStr=new Date().toLocaleDateString("tr-TR");
  const el=document.createElement("div");
  el.style.cssText="position:fixed;left:-9999px;top:0;width:794px;background:#fff;font-family:Arial,Helvetica,sans-serif;padding:48px;color:#1a1a2e;box-sizing:border-box";
  el.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px;padding-bottom:18px;border-bottom:3px solid #f97316">
      <div><div style="font-size:24px;font-weight:900;color:#f97316">🦷 Turuncu Dental</div><div style="font-size:11px;color:#888;margin-top:3px">Diş Turizmi Hizmetleri</div></div>
      <div style="text-align:right"><div style="font-size:20px;font-weight:900;color:#1a1a2e;letter-spacing:3px">TEKLİF</div><div style="font-size:10px;color:#777;margin-top:8px">Tarih: ${dateStr}</div></div>
    </div>
    <div style="margin-bottom:20px;padding:14px 16px;background:#fff8f0;border-radius:6px;border-left:3px solid #f97316">
      <div style="font-size:9px;font-weight:700;color:#f97316;letter-spacing:1px;margin-bottom:6px">HASTA BİLGİLERİ</div>
      <div style="font-size:15px;font-weight:700">${p.name}</div>
      ${p.country?`<div style="font-size:12px;color:#555;margin-top:2px">${p.country}</div>`:""}
      ${p.email?`<div style="font-size:11px;color:#777;margin-top:2px">${p.email}</div>`:""}
      ${p.phone?`<div style="font-size:11px;color:#777">${p.phone}</div>`:""}
    </div>
    <table style="width:100%;border-collapse:collapse;margin-bottom:18px">
      <thead><tr style="background:#f97316">
        <th style="padding:9px 12px;text-align:left;font-size:10px;font-weight:700;color:#fff">TEDAVİ</th>
        <th style="padding:9px 12px;text-align:center;font-size:10px;font-weight:700;color:#fff;width:60px">ADET</th>
        <th style="padding:9px 12px;text-align:right;font-size:10px;font-weight:700;color:#fff;width:120px">BİRİM FİYAT</th>
        <th style="padding:9px 12px;text-align:right;font-size:10px;font-weight:700;color:#fff;width:120px">TOPLAM</th>
      </tr></thead>
      <tbody>${treatments.length?treatments.map((tr,i)=>`<tr style="background:${i%2?"#fff8f0":"#fff"}">
        <td style="padding:9px 12px;font-size:12px">${tr.name}</td>
        <td style="padding:9px 12px;text-align:center;font-size:12px;color:#555">${tr.qty||1}</td>
        <td style="padding:9px 12px;text-align:right;font-size:12px;color:#555">£${(tr.price||0).toLocaleString()}</td>
        <td style="padding:9px 12px;text-align:right;font-size:12px;font-weight:700">£${((tr.qty||1)*(tr.price||0)).toLocaleString()}</td>
      </tr>`).join(""):`<tr><td colspan="4" style="padding:16px;text-align:center;color:#888;font-size:12px">Tedavi seçilmemiş</td></tr>`}</tbody>
    </table>
    <div style="display:flex;justify-content:flex-end;margin-bottom:20px">
      <div style="min-width:220px">
        <div style="display:flex;justify-content:space-between;padding:7px 12px;background:#f8f9fa;border:1px solid #e9ecef;border-bottom:none;border-radius:4px 4px 0 0"><span style="font-size:11px;color:#777">Ara Toplam</span><span style="font-size:12px;font-weight:600">£${sub.toLocaleString()}</span></div>
        ${b.discount?`<div style="display:flex;justify-content:space-between;padding:7px 12px;background:#f8f9fa;border:1px solid #e9ecef;border-bottom:none"><span style="font-size:11px;color:#777">İndirim</span><span style="font-size:12px;font-weight:600;color:#e55">-£${(b.discount).toLocaleString()}</span></div>`:""}
        <div style="display:flex;justify-content:space-between;padding:8px 12px;background:#f97316;border-radius:0 0 4px 4px"><span style="font-size:12px;font-weight:700;color:#fff">TOPLAM</span><span style="font-size:14px;font-weight:900;color:#fff">£${total.toLocaleString()}</span></div>
        ${b.deposit?`<div style="display:flex;justify-content:space-between;padding:7px 12px;background:#f0fff4;border:1px solid #c6f6d5;border-top:none;border-radius:0 0 4px 4px"><span style="font-size:11px;color:#777">Alınan Ön Ödeme</span><span style="font-size:12px;font-weight:600;color:#22863a">£${(b.deposit).toLocaleString()}</span></div>
        <div style="display:flex;justify-content:space-between;padding:7px 12px;background:#fff8f0;border:1px solid #fed7aa;border-top:none;border-radius:0 0 4px 4px"><span style="font-size:11px;color:#777">Kalan Ödeme</span><span style="font-size:12px;font-weight:600;color:#c2410c">£${balance.toLocaleString()}</span></div>`:""}
      </div>
    </div>
    ${(b.accommodations||[]).length||(b.travels||[]).length?`<div style="background:#f8f9fa;border-left:3px solid #f97316;padding:12px 16px;border-radius:0 6px 6px 0;margin-bottom:16px">
      <div style="font-size:9px;font-weight:700;color:#f97316;letter-spacing:1px;margin-bottom:8px">SEYAHAT & KONAKLAMA</div>
      ${(b.accommodations||[]).map(a=>`<div style="font-size:12px;color:#555;margin-bottom:3px">🏨 ${a.name} — ${a.nights} gece × £${a.pricePerNight} = <strong>£${((a.nights||1)*(a.pricePerNight||0)).toLocaleString()}</strong></div>`).join("")}
      ${(b.travels||[]).map(tr=>`<div style="font-size:12px;color:#555;margin-bottom:3px">✈️ ${tr.name} — ${tr.persons} kişi × £${tr.price} = <strong>£${((tr.persons||1)*(tr.price||0)).toLocaleString()}</strong></div>`).join("")}
    </div>`:""}
    <div style="margin-top:24px;padding-top:12px;border-top:1px solid #e9ecef;text-align:center;font-size:9px;color:#aaa">
      Hazırlayan: ${currentUser.display_name||currentUser.username} · Tarih: ${dateStr} · Turuncu Dental CRM
    </div>`;
  document.body.appendChild(el);
  try{
    const canvas=await html2canvas(el,{scale:2,backgroundColor:"#ffffff",logging:false,useCORS:true});
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:"px",format:"a4",orientation:"portrait"});
    const pW=pdf.internal.pageSize.getWidth(),pH=pdf.internal.pageSize.getHeight();
    const ratio=pW/canvas.width;const scaledH=canvas.height*ratio;
    const img=canvas.toDataURL("image/jpeg",0.95);
    let y=0;while(y<scaledH){if(y>0)pdf.addPage();pdf.addImage(img,"JPEG",0,-y,pW,scaledH);y+=pH;}
    pdf.save(`teklif-${p.name.replace(/\s+/g,"-")}.pdf`);
    toast("PDF indirildi ✓");
  }catch{toast("PDF oluşturulamadı","err");}
  document.body.removeChild(el);
}
// ==INIT==
(async()=>{
  const saved=sessionStorage.getItem("crm_user");
  if(saved){try{currentUser=JSON.parse(saved);await showApp();}catch{sessionStorage.removeItem("crm_user");}}
})();
</script>
