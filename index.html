body{font-family:'DM Sans',sans-serif;background:#090d14;color:#dde4ef;height:100vh;display:flex;overflow:hidden}

#login-screen{position:fixed;inset:0;background:#090d14;display:flex;align-items:center;justify-content:center;z-index:200;flex-direction:column}

.login-logo{font-size:26px;font-weight:900;background:linear-gradient(135deg,#f97316,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-1px;margin-bottom:4px}
.login-sub{font-size:12px;color:#3d5270;margin-bottom:28px}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-size:11px;color:#3d5270;margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.login-field input{width:100%;background:#131b2a;border:1px solid #1a2236;border-radius:9px;padding:10px 13px;color:#dde4ef;font-size:14px;outline:none;transition:border-color .15s}

.login-btn{width:100%;background:linear-gradient(135deg,#f97316,#fbbf24);color:#090d14;border:none;border-radius:9px;padding:11px;font-weight:800;font-size:14px;cursor:pointer;margin-top:4px;font-family:'DM Sans',sans-serif}

.login-lang{display:flex;gap:8px;margin-bottom:20px}

.login-lang button.active{background:#1e2d40;color:#f97316;border-color:#f9731644}
.shake{animation:shake .3s ease}
#app{display:none;width:100%;height:100%}
#sidebar{width:210px;background:#0d1320;border-right:1px solid #1a2236;display:flex;flex-direction:column;flex-shrink:0}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{background:#0d1320;border-bottom:1px solid #1a2236;padding:11px 20px;display:flex;align-items:center;gap:10px;flex-shrink:0}
#content{flex:1;overflow-y:auto;padding:20px}
.logo{padding:16px 16px 10px;border-bottom:1px solid #1a2236}

.logo-sub{font-size:10px;color:#3d5270;margin-top:1px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#34d399;animation:pulse 2s infinite;display:inline-block;margin-right:5px}
.sync-label{font-size:11px;color:#34d399;font-weight:600}
.user-box{padding:10px 12px;border-bottom:1px solid #1a2236;display:flex;align-items:center;gap:8px}
.user-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-name{font-size:12px;font-weight:700;color:#dde4ef;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:10px;color:#3d5270}
.logout-btn{background:none;border:none;color:#3d5270;cursor:pointer;font-size:14px;padding:2px;flex-shrink:0}

.lang-box{padding:8px 12px;border-bottom:1px solid #1a2236;display:flex;gap:6px}
.lang-btn{flex:1;padding:5px;border-radius:7px;border:1px solid #1a2236;background:#131b2a;color:#4a607d;font-size:12px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif}
.lang-btn.active{background:#1e2d40;color:#f97316;border-color:#f9731644}
nav{padding:8px 0;flex:1;overflow-y:auto}
nav button{width:100%;display:flex;align-items:center;gap:10px;padding:9px 16px;background:transparent;color:#4a607d;border:none;cursor:pointer;font-size:13px;font-weight:500;border-left:2px solid transparent;transition:all .12s;text-align:left;font-family:'DM Sans',sans-serif}
nav button.active{background:#1a1208;color:#f97316;font-weight:700;border-left-color:#f97316}

.sidebar-footer{padding:10px 14px;border-top:1px solid #1a2236;font-size:11px;color:#3d5270;margin-top:auto}
.search-wrap{position:relative;max-width:300px;flex:1}
.search-wrap input{width:100%;background:#131b2a;border:1px solid #1a2236;border-radius:8px;padding:7px 28px 7px 28px;color:#dde4ef;font-size:13px;outline:none}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:#3d5270;font-size:13px;pointer-events:none}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:#4a607d;cursor:pointer;font-size:13px}
.btn{background:#f97316;color:#fff;border:none;border-radius:8px;padding:6px 13px;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif;transition:opacity .15s}
.btn.sec{background:#131b2a;color:#4a607d;border:1px solid #1a2236}
.btn.green{background:#34d399;color:#0d1320}
.btn:hover{opacity:.9}
.sm-btn{background:#131b2a;color:#4a607d;border:1px solid #1a2236;border-radius:6px;padding:3px 7px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif}
.sm-btn.danger{background:#f8717118;color:#f87171;border-color:#f8717133}
.sm-btn.success{background:#34d39918;color:#34d399;border-color:#34d39933}
.sm-btn.warn{background:#f59e0b18;color:#f59e0b;border-color:#f59e0b33}
.sm-btn.orange{background:#f9731618;color:#f97316;border-color:#f9731633}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:13px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.kpi-val{font-size:22px;font-weight:900;letter-spacing:-1px}
.kpi-lbl{font-size:11px;color:#dde4ef;margin-top:3px;font-weight:600}
.kpi-sub{font-size:10px;color:#3d5270;margin-top:1px}
.badge{font-size:11px;padding:2px 9px;border-radius:20px;display:inline-block;white-space:nowrap}
.section-title{font-weight:700;margin-bottom:12px;font-size:13px;color:#f97316}
.modal-overlay{position:fixed;inset:0;background:#00000099;display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:#0d1320;border:1px solid #1a2236;border-radius:14px;padding:24px;width:440px;max-height:90vh;overflow-y:auto;max-width:95vw}
.modal-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-title span{font-weight:800;font-size:15px}
.modal-title button{background:none;border:none;color:#3d5270;font-size:17px;cursor:pointer}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:#3d5270;margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.field input,.field select,.field textarea{width:100%;background:#131b2a;border:1px solid #1a2236;border-radius:8px;padding:7px 10px;color:#dde4ef;font-size:13px;outline:none;font-family:'DM Sans',sans-serif}
.field select option{background:#131b2a}
.field textarea{resize:vertical}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions{display:flex;gap:9px;margin-top:16px}
.modal-actions button{flex:1;padding:8px;border-radius:8px;cursor:pointer;font-weight:700;font-size:13px;border:none;font-family:'DM Sans',sans-serif}
.modal-actions .cancel{background:#131b2a;color:#4a607d;border:1px solid #1a2236}
.modal-actions .save{background:#f97316;color:#fff;flex:2}
.toast-wrap{position:fixed;top:16px;right:16px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast{padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;animation:fadeIn .2s ease}
.toast.ok{background:#34d39918;border:1px solid #34d39944;color:#34d399}
.toast.warn{background:#f59e0b18;border:1px solid #f59e0b44;color:#f59e0b}
.toast.err{background:#f8717118;border:1px solid #f8717144;color:#f87171}

.pt-header{background:#0d1320;border-bottom:1px solid #1a2236;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.pt-tabs{display:flex;gap:0;border-bottom:1px solid #1a2236;background:#0d1320;padding:0 20px;flex-shrink:0;overflow-x:auto}
.pt-tab{padding:10px 18px;font-size:13px;font-weight:600;color:#4a607d;border:none;background:transparent;cursor:pointer;border-bottom:2px solid transparent;font-family:'DM Sans',sans-serif;transition:all .15s;white-space:nowrap}
.pt-tab.active{color:#f97316;border-bottom-color:#f97316}
.pt-body{flex:1;overflow-y:auto;padding:20px}
.tooth-chart-wrap{overflow-x:auto;padding:10px 0}
.tooth-row{display:flex;align-items:flex-end;gap:2px;justify-content:center;margin-bottom:3px}
.tooth{width:34px;min-height:42px;border:2px solid #1a2236;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:pointer;font-size:9px;font-weight:700;color:#3d5270;transition:all .12s;position:relative;background:#131b2a;padding-bottom:3px;gap:2px}
.tooth:hover{border-color:#f97316;color:#dde4ef}
.tooth-num{font-size:8px;font-weight:800;line-height:1}
.tooth-icon{font-size:12px;line-height:1}
.tooth-sep{width:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#1a2236;font-size:16px}
.tooth-popup{position:fixed;background:#0d1320;border:1px solid #1a2236;border-radius:10px;padding:14px;z-index:300;min-width:220px;box-shadow:0 8px 32px #00000099;animation:fadeIn .15s ease}
.status-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.status-tab{padding:5px 12px;border-radius:20px;border:1px solid #1a2236;background:#131b2a;color:#4a607d;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}
.status-tab.active{border-color:#f9731644;background:#f9731618;color:#f97316}
.data-table{width:100%;border-collapse:collapse}
.data-table th{font-size:10px;font-weight:700;color:#3d5270;text-transform:uppercase;letter-spacing:.5px;padding:8px 12px;text-align:left;border-bottom:1px solid #1a2236;white-space:nowrap}
.data-table td{padding:9px 12px;font-size:13px;border-bottom:1px solid #0f1825}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:#0f1825}
.empty{text-align:center;color:#3d5270;padding:36px 0;font-size:13px}
.loading{display:flex;align-items:center;justify-content:center;height:80%;flex-direction:column;gap:16px}
.spinner{font-size:32px;animation:spin 1s linear infinite;color:#f97316}
.stat-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #1a2236}
.stat-row span:first-child{font-size:12px;color:#4a607d}
.stat-row span:last-child{font-size:13px;font-weight:700}
.toggle-group{display:flex;border:1px solid #1a2236;border-radius:8px;overflow:hidden;width:fit-content}
.toggle-btn{padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:#131b2a;color:#4a607d;font-family:'DM Sans',sans-serif}
.toggle-btn.active{background:#f9731622;color:#f97316}

.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:#4a607d}
.legend-dot{width:12px;height:12px;border-radius:3px;flex-shrink:0}

  <div class="pt-body" id="pt-body"></div>

function bookingTotal(p){
  const txSub=(p.booking?.treatments||[]).reduce((s,tr)=>s+(tr.qty||1)*(tr.price||0),0);
  const acSub=(p.booking?.accommodations||[]).reduce((s,a)=>s+(a.nights||1)*(a.pricePerNight||0),0);
  const trSub=(p.booking?.travels||[]).reduce((s,tr)=>s+(tr.persons||1)*(tr.price||0),0);
  return txSub+acSub+trSub-(p.booking?.discount||0);
}

// ── SUPABASE CRUD  (localStorage = primary; Supabase = initial seed only)
async function dbGet(table){
  // localStorage is always the source of truth once it has data
  try{const local=localStorage.getItem("crm_"+table);if(local)return JSON.parse(local);}catch{}
  // First use: pull from Supabase to seed localStorage
  try{
    const r=await fetch(`${SUPA_URL}/rest/v1/${table}?select=*`,{headers:H});
    if(r.ok){const rows=await r.json();if(rows&&rows.length>0){localStorage.setItem("crm_"+table,JSON.stringify(rows));return rows;}}
  }catch{}
  return null;
}
async function dbSet(table,data){
  try{localStorage.setItem("crm_"+table,JSON.stringify([{id:1,data}]));}catch{}
  try{await fetch(`${SUPA_URL}/rest/v1/${table}`,{method:"POST",headers:{...H,"Prefer":"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({id:1,data})});}catch{}
}
async function persist(table){document.getElementById("syncing-label").style.display="inline";await dbSet(table,state[table]);document.getElementById("syncing-label").style.display="none";updateFooter();}
async function loadAll(){
  const [p,e,a,tr]=await Promise.all([dbGet("customers"),dbGet("deals"),dbGet("tasks"),dbGet("history")]);
  state.patients=(p&&p[0])?p[0].data:SEED_PATIENTS;
  state.events=(e&&e[0])?e[0].data:SEED_EVENTS;
  state.appointments=(a&&a[0])?a[0].data:SEED_APPOINTMENTS;
  state.treatments=(tr&&tr[0])?tr[0].data:SEED_TREATMENTS;
  if(!p||!p[0])dbSet("customers",SEED_PATIENTS);
  if(!e||!e[0])dbSet("deals",SEED_EVENTS);
  if(!a||!a[0])dbSet("tasks",SEED_APPOINTMENTS);
  if(!tr||!tr[0])dbSet("history",SEED_TREATMENTS);
}
async function loadUsers(){try{const r=await fetch(`${SUPA_URL}/rest/v1/crm_users?select=id,username,role,display_name&order=id`,{headers:H});if(r.ok)state.users=await r.json();}catch{}}

function shake(){const b=document.querySelector(".login-box");b.classList.remove("shake");setTimeout(()=>b.classList.add("shake"),10);}
async function doLogin(){
  const username=document.getElementById("login-username").value.trim();
  const password=document.getElementById("login-password").value;
  if(!username||!password){document.getElementById("login-err").textContent=t.loginErr;shake();return;}
  const btn=document.getElementById("login-btn");btn.textContent=t.loginLoading;btn.disabled=true;
  try{
    const r=await fetch(`${SUPA_URL}/rest/v1/crm_users?username=eq.${encodeURIComponent(username)}&password=eq.${encodeURIComponent(password)}&select=*`,{headers:{...H,"Prefer":"return=representation"}});
    if(r.ok){
      const data=await r.json();
      if(data&&data.length>0){currentUser=data[0];sessionStorage.setItem("crm_user",JSON.stringify(currentUser));await showApp();btn.textContent=t.loginBtn;btn.disabled=false;return;}
    }
  }catch{}
  // Supabase'e ulaşılamazsa yedek kullanıcılar
  const fallback=FALLBACK_USERS.find(u=>u.username===username&&u.password===password);
  if(fallback){
    currentUser={id:fallback.id,username:fallback.username,role:fallback.role,display_name:fallback.display_name};
    sessionStorage.setItem("crm_user",JSON.stringify(currentUser));
    await showApp();
  } else {

function toothClick(e,num){
  e.stopPropagation();
  document.querySelectorAll(".tooth-popup").forEach(p=>p.remove());
  const p=getPatient(currentPatientId);if(!p)return;
  const a=p.assessment||{currentCondition:{},treatmentPlan:{}};
  const chart=a[chartMode]||{};
  const condKeys=["healthy","cavity","crown","missing","implant","root_canal","veneer","filling","bridge","extraction"];
  const popup=document.createElement("div");
  popup.className="tooth-popup";
  const rect=e.currentTarget.getBoundingClientRect();
  let left=rect.left+rect.width/2-110,top=rect.bottom+8;
  if(left<8)left=8;
  if(left+220>window.innerWidth)left=window.innerWidth-228;
  if(top+200>window.innerHeight)top=rect.top-208;
  popup.style.left=left+"px";popup.style.top=top+"px";
  popup.innerHTML=`<div style="font-size:11px;font-weight:800;color:#f97316;margin-bottom:8px">Diş ${num} — ${chartMode==="currentCondition"?t.currentCondition:t.treatmentPlan}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:5px">
    ${condKeys.map(k=>{const cur=chart[num]===k||(!chart[num]&&k==="healthy");return`<button onclick="setToothCond(${num},'${k}')" style="padding:5px 8px;border-radius:6px;border:1px solid ${cur?"#f97316":"#1a2236"};background:${cur?"#f9731622":"#131b2a"};color:${cur?"#f97316":"#4a607d"};font-size:11px;font-weight:600;cursor:pointer;text-align:left;font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:4px"><span>${TOOTH_ICONS[k]||"○"}</span><span>${condLabel(k)}</span></button>`}).join("")}
    </div>`;
  document.body.appendChild(popup);
  setTimeout(()=>document.addEventListener("click",()=>popup.remove(),{once:true}),10);
}

function setToothCond(num,cond){
  document.querySelectorAll(".tooth-popup").forEach(p=>p.remove());
  const p=getPatient(currentPatientId);if(!p)return;
  if(!p.assessment)p.assessment={currentCondition:{},treatmentPlan:{},dentistNotes:""};
  if(!p.assessment[chartMode])p.assessment[chartMode]={};
  if(cond==="healthy")delete p.assessment[chartMode][num];
  else p.assessment[chartMode][num]=cond;
  renderPtBody();
}

function renderReportCharts(){
  const statusKeys=["walkin","consultation","assessed","pricing","booked","cancelled"];
  const statusData=statusKeys.map(s=>state.patients.filter(p=>p.status===s).length);
  const statusColors=statusKeys.map(s=>STATUS_COLORS[s]);
  const statusEl=document.getElementById("statusChart");
  if(statusEl){if(charts.status)charts.status.destroy();charts.status=new Chart(statusEl,{type:"bar",data:{labels:statusKeys.map(s=>statusLabel(s)),datasets:[{data:statusData,backgroundColor:statusColors,borderRadius:5}]},options:{plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{color:"#3d5270",font:{size:10}}},y:{grid:{color:"#1a2236"},ticks:{color:"#3d5270",stepSize:1}}},responsive:true,maintainAspectRatio:false}});}
  const cats={};state.treatments.forEach(tr=>{const rev=state.patients.filter(p=>p.status==="booked").reduce((s,p)=>{const btr=(p.booking?.treatments||[]).find(bt=>bt.treatmentId===tr.id);return s+(btr?(btr.qty||1)*(btr.price||0):0);},0);if(rev>0)cats[tr.category]=(cats[tr.category]||0)+rev;});
  const catEl=document.getElementById("catChart");
  if(catEl){if(charts.cat)charts.cat.destroy();const catColors=["#f97316","#60a5fa","#34d399","#a78bfa","#f59e0b","#f472b6","#22d3ee"];const ckeys=Object.keys(cats);charts.cat=new Chart(catEl,{type:"doughnut",data:{labels:ckeys,datasets:[{data:ckeys.map(k=>cats[k]),backgroundColor:catColors,borderWidth:0}]},options:{plugins:{legend:{labels:{color:"#94a3b8",font:{size:11}}}},responsive:true,maintainAspectRatio:false}});}
  const countries={};state.patients.forEach(p=>{if(p.country)countries[p.country]=(countries[p.country]||0)+1;});
  const cEl=document.getElementById("countryChart");
  if(cEl){if(charts.country)charts.country.destroy();const cks=Object.keys(countries).sort((a,b)=>countries[b]-countries[a]).slice(0,8);charts.country=new Chart(cEl,{type:"bar",data:{labels:cks.map(c=>`${flag(c)} ${c}`),datasets:[{data:cks.map(c=>countries[c]),backgroundColor:"#f97316",borderRadius:5}]},options:{plugins:{legend:{display:false}},indexAxis:"y",scales:{x:{grid:{color:"#1a2236"},ticks:{color:"#3d5270",stepSize:1}},y:{grid:{display:false},ticks:{color:"#94a3b8",font:{size:11}}}},responsive:true,maintainAspectRatio:false}});}
}

async function saveUser(editId){

  if(editId){
    const upd={display_name:displayName,role};if(password)upd.password=password;
    try{const r=await fetch(`${SUPA_URL}/rest/v1/crm_users?id=eq.${editId}`,{method:"PATCH",headers:{...H,"Prefer":"return=minimal"},body:JSON.stringify(upd)});if(!r.ok){toast("Güncelleme başarısız","err");return;}
    state.users=state.users.map(u=>u.id===editId?{...u,...upd}:u);
    if(editId===currentUser.id){currentUser={...currentUser,display_name:displayName,role};sessionStorage.setItem("crm_user",JSON.stringify(currentUser));const color=ROLE_COLORS[role]||"#f97316";document.getElementById("user-name").textContent=displayName||username;document.getElementById("user-avatar").textContent=(displayName||username)[0].toUpperCase();document.getElementById("user-role").textContent=role;document.getElementById("user-role").style.color=color;}
    toast(t.userUpdated);}catch{toast("Hata","err");return;}
  } else {
    if(state.users.some(u=>u.username===username)){toast(t.usernameExists,"err");return;}
    try{const r=await fetch(`${SUPA_URL}/rest/v1/crm_users`,{method:"POST",headers:{...H,"Prefer":"return=representation"},body:JSON.stringify({username,password,role,display_name:displayName})});if(!r.ok){toast("Eklenemedi","err");return;}const added=(await r.json());state.users.push({id:(Array.isArray(added)?added[0]:added).id,username,role,display_name:displayName});toast(t.userAdded);}catch{toast("Hata","err");return;}
  }

}

      <div style="min-width:220px">
        <div style="display:flex;justify-content:space-between;padding:7px 12px;background:#f8f9fa;border:1px solid #e9ecef;border-bottom:none;border-radius:4px 4px 0 0"><span style="font-size:11px;color:#777">Ara Toplam</span><span style="font-size:12px;font-weight:600">£${sub.toLocaleString()}</span></div>
        ${b.discount?`<div style="display:flex;justify-content:space-between;padding:7px 12px;background:#f8f9fa;border:1px solid #e9ecef;border-bottom:none"><span style="font-size:11px;color:#777">İndirim</span><span style="font-size:12px;font-weight:600;color:#e55">-£${(b.discount).toLocaleString()}</span></div>`:""}
        <div style="display:flex;justify-content:space-between;padding:8px 12px;background:#f97316;border-radius:0 0 4px 4px"><span style="font-size:12px;font-weight:700;color:#fff">TOPLAM</span><span style="font-size:14px;font-weight:900;color:#fff">£${total.toLocaleString()}</span></div>
        ${b.deposit?`<div style="display:flex;justify-content:space-between;padding:7px 12px;background:#f0fff4;border:1px solid #c6f6d5;border-top:none;border-radius:0 0 4px 4px"><span style="font-size:11px;color:#777">Alınan Ön Ödeme</span><span style="font-size:12px;font-weight:600;color:#22863a">£${(b.deposit).toLocaleString()}</span></div>
        <div style="display:flex;justify-content:space-between;padding:7px 12px;background:#fff8f0;border:1px solid #fed7aa;border-top:none;border-radius:0 0 4px 4px"><span style="font-size:11px;color:#777">Kalan Ödeme</span><span style="font-size:12px;font-weight:600;color:#c2410c">£${balance.toLocaleString()}</span></div>`:""}
      </div>
    </div>
    ${(b.accommodations||[]).length||(b.travels||[]).length?`<div style="background:#f8f9fa;border-left:3px solid #f97316;padding:12px 16px;border-radius:0 6px 6px 0;margin-bottom:16px">
      <div style="font-size:9px;font-weight:700;color:#f97316;letter-spacing:1px;margin-bottom:8px">SEYAHAT & KONAKLAMA</div>
      ${(b.accommodations||[]).map(a=>`<div style="font-size:12px;color:#555;margin-bottom:3px">🏨 ${a.name} — ${a.nights} gece × £${a.pricePerNight} = <strong>£${((a.nights||1)*(a.pricePerNight||0)).toLocaleString()}</strong></div>`).join("")}
      ${(b.travels||[]).map(tr=>`<div style="font-size:12px;color:#555;margin-bottom:3px">✈️ ${tr.name} — ${tr.persons} kişi × £${tr.price} = <strong>£${((tr.persons||1)*(tr.price||0)).toLocaleString()}</strong></div>`).join("")}
    </div>`:""}
    <div style="margin-top:24px;padding-top:12px;border-top:1px solid #e9ecef;text-align:center;font-size:9px;color:#aaa">
      Hazırlayan: ${currentUser.display_name||currentUser.username} · Tarih: ${dateStr} · Turuncu Dental CRM
    </div>`;
  document.body.appendChild(el);
  try{
    const canvas=await html2canvas(el,{scale:2,backgroundColor:"#ffffff",logging:false,useCORS:true});
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:"px",format:"a4",orientation:"portrait"});
    const pW=pdf.internal.pageSize.getWidth(),pH=pdf.internal.pageSize.getHeight();
    const ratio=pW/canvas.width;const scaledH=canvas.height*ratio;
    const img=canvas.toDataURL("image/jpeg",0.95);
    let y=0;while(y<scaledH){if(y>0)pdf.addPage();pdf.addImage(img,"JPEG",0,-y,pW,scaledH);y+=pH;}
    pdf.save(`teklif-${p.name.replace(/\s+/g,"-")}.pdf`);
    toast("PDF indirildi ✓");
  }catch{toast("PDF oluşturulamadı","err");}
  document.body.removeChild(el);
}
// ==INIT==
(async()=>{
  const saved=sessionStorage.getItem("crm_user");
  if(saved){try{currentUser=JSON.parse(saved);await showApp();}catch{sessionStorage.removeItem("crm_user");}}
})();
</script>
